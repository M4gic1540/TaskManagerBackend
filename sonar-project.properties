sonar.projectKey=TaskManagerBackend
sonar.projectName=TaskManagerBackend
sonar.sources=.
sonar.exclusions=**/.venv/**,**/venv/**,**/migrations/**,**/media/**,**/.git/**,**/__pycache__/**,**/.pytest_cache/**,**/node_modules/**,**/*.sqlite3,**/staticfiles/**,**/tests/**
sonar.tests=accounts/tests,tickets/tests,inventory/tests,core/tests,gateway/tests,bff/tests
sonar.python.version=3.13
