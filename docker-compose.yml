# Orquesta los 5 microservicios (accounts, tickets, inventory, gateway,
# bff) + su BD PostgreSQL propia cada uno (accounts/tickets/inventory)
# + Redis (sesión del bff), localmente, reusando el mismo Dockerfile
# parametrizado por SERVICE_SETTINGS. Jenkins/SonarQube quedan fuera de
# este compose — siguen gestionados aparte, contra el monolito
# (`docker build .` sin build-arg, ver Dockerfile).
#
# Orden de arranque: cada microservicio depende de su propia BD con
# `condition: service_healthy` (pg_isready), así Compose no lo arranca
# hasta que Postgres está realmente aceptando conexiones — no solo
# "el contenedor existe". El gateway a su vez depende de que los 3
# microservicios estén healthy (su propio /readyz/, que ya valida su
# conexión a BD), y el bff depende de que el gateway Y redis estén
# healthy, así que la cadena completa es: (Postgres x3 -> UP ->
# accounts/tickets/inventory -> healthy) + redis -> healthy -> gateway
# -> healthy -> bff.
#
# Uso: copiar .env.example a .env, completar SECRET_KEY, las
# credenciales GLPI_DB_* y las *_DB_PASSWORD de cada Postgres, y correr
# `docker compose up --build`. El frontend TODAVÍA habla con el gateway
# (8000) — el bff (8010, fase 2 del plan de BFF: login/logout/me con
# sesión propia) está expuesto en un puerto aparte mientras no
# reemplaza nada. Los 3 servicios internos, sus BD y redis solo son
# alcanzables dentro de la red del compose.

services:
  db-accounts:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ACCOUNTS_DB_NAME:-accounts}
      POSTGRES_USER: ${ACCOUNTS_DB_USER:-accounts}
      POSTGRES_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?Falta ACCOUNTS_DB_PASSWORD en .env}
    volumes:
      - db_accounts_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ACCOUNTS_DB_USER:-accounts} -d ${ACCOUNTS_DB_NAME:-accounts}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db-tickets:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TICKETS_DB_NAME:-tickets}
      POSTGRES_USER: ${TICKETS_DB_USER:-tickets}
      POSTGRES_PASSWORD: ${TICKETS_DB_PASSWORD:?Falta TICKETS_DB_PASSWORD en .env}
    volumes:
      - db_tickets_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TICKETS_DB_USER:-tickets} -d ${TICKETS_DB_NAME:-tickets}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db-inventory:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory}
      POSTGRES_USER: ${INVENTORY_DB_USER:-inventory}
      POSTGRES_PASSWORD: ${INVENTORY_DB_PASSWORD:?Falta INVENTORY_DB_PASSWORD en .env}
    volumes:
      - db_inventory_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INVENTORY_DB_USER:-inventory} -d ${INVENTORY_DB_NAME:-inventory}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  accounts:
    build:
      context: .
      args:
        SERVICE_SETTINGS: config.service_settings.accounts
    environment:
      DJANGO_SETTINGS_MODULE: config.service_settings.accounts
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},accounts
      ACCOUNTS_DB_ENGINE: django.db.backends.postgresql
      ACCOUNTS_DB_HOST: db-accounts
      ACCOUNTS_DB_PORT: 5432
      ACCOUNTS_DB_NAME: ${ACCOUNTS_DB_NAME:-accounts}
      ACCOUNTS_DB_USER: ${ACCOUNTS_DB_USER:-accounts}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD:?Falta ACCOUNTS_DB_PASSWORD en .env}
      # Secreto compartido con bff para auth/google-mint/ (ver
      # config/service_settings/accounts.py) — requerido, sin default.
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Falta INTERNAL_AUTH_SECRET en .env}
      # Login LDAP institucional (ver config/settings.py). Vacío =
      # LDAP desactivado, no rompe nada.
      LDAP_SERVER_URI: ${LDAP_SERVER_URI:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_SEARCH_BASE: ${LDAP_USER_SEARCH_BASE:-}
    depends_on:
      db-accounts:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  tickets:
    build:
      context: .
      args:
        SERVICE_SETTINGS: config.service_settings.tickets
    environment:
      DJANGO_SETTINGS_MODULE: config.service_settings.tickets
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},tickets
      TICKETS_DB_ENGINE: django.db.backends.postgresql
      TICKETS_DB_HOST: db-tickets
      TICKETS_DB_PORT: 5432
      TICKETS_DB_NAME: ${TICKETS_DB_NAME:-tickets}
      TICKETS_DB_USER: ${TICKETS_DB_USER:-tickets}
      TICKETS_DB_PASSWORD: ${TICKETS_DB_PASSWORD:?Falta TICKETS_DB_PASSWORD en .env}
      # Correo saliente (respuestas de ticket, ver tickets/observers.py).
      # Sin EMAIL_HOST_USER/PASSWORD reales cae al backend de consola
      # (se ve en `docker compose logs tickets`, no rompe nada).
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-localhost}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-no-reply@cmm.uchile.cl}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # Clasificación automática de tickets: modelo local entrenado con
      # scikit-learn (ver tickets/ml/), sin servicios externos.
      TICKET_AI_CONFIDENCE_THRESHOLD: ${TICKET_AI_CONFIDENCE_THRESHOLD:-0.5}
      # SLA plano en horas (ver tickets/services/dashboard_service.py).
      TICKET_SLA_HOURS: ${TICKET_SLA_HOURS:-8}
      # Ingesta de correo entrante (ver tickets/management/commands/
      # poll_inbound_email.py) — mismas vars que usa el servicio
      # tickets-email-poller de abajo. Vacío = desactivado.
      INBOUND_EMAIL_HOST: ${INBOUND_EMAIL_HOST:-}
      INBOUND_EMAIL_PORT: ${INBOUND_EMAIL_PORT:-993}
      INBOUND_EMAIL_USER: ${INBOUND_EMAIL_USER:-}
      INBOUND_EMAIL_PASSWORD: ${INBOUND_EMAIL_PASSWORD:-}
      INBOUND_EMAIL_USE_SSL: ${INBOUND_EMAIL_USE_SSL:-True}
      INBOUND_EMAIL_FOLDER: ${INBOUND_EMAIL_FOLDER:-INBOX}
      INBOUND_EMAIL_POLL_INTERVAL_SECONDS: ${INBOUND_EMAIL_POLL_INTERVAL_SECONDS:-60}
    depends_on:
      db-tickets:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Ingesta de correo -> ticket (ver tickets/management/commands/
  # poll_inbound_email.py). Mismo build/imagen que 'tickets' (misma BD,
  # mismo Ticket model), pero corre el poller en loop en vez de
  # gunicorn — proceso de fondo separado, no atiende HTTP.
  tickets-email-poller:
    build:
      context: .
      args:
        SERVICE_SETTINGS: config.service_settings.tickets
    command: ["python", "manage.py", "poll_inbound_email"]
    environment:
      DJANGO_SETTINGS_MODULE: config.service_settings.tickets
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},tickets
      TICKETS_DB_ENGINE: django.db.backends.postgresql
      TICKETS_DB_HOST: db-tickets
      TICKETS_DB_PORT: 5432
      TICKETS_DB_NAME: ${TICKETS_DB_NAME:-tickets}
      TICKETS_DB_USER: ${TICKETS_DB_USER:-tickets}
      TICKETS_DB_PASSWORD: ${TICKETS_DB_PASSWORD:?Falta TICKETS_DB_PASSWORD en .env}
      TICKET_AI_CONFIDENCE_THRESHOLD: ${TICKET_AI_CONFIDENCE_THRESHOLD:-0.5}
      INBOUND_EMAIL_HOST: ${INBOUND_EMAIL_HOST:-}
      INBOUND_EMAIL_PORT: ${INBOUND_EMAIL_PORT:-993}
      INBOUND_EMAIL_USER: ${INBOUND_EMAIL_USER:-}
      INBOUND_EMAIL_PASSWORD: ${INBOUND_EMAIL_PASSWORD:-}
      INBOUND_EMAIL_USE_SSL: ${INBOUND_EMAIL_USE_SSL:-True}
      INBOUND_EMAIL_FOLDER: ${INBOUND_EMAIL_FOLDER:-INBOX}
      INBOUND_EMAIL_POLL_INTERVAL_SECONDS: ${INBOUND_EMAIL_POLL_INTERVAL_SECONDS:-60}
    depends_on:
      db-tickets:
        condition: service_healthy
      # El servicio web 'tickets' es quien migra esta misma base (ver
      # entrypoint.sh) — esperar a que esté healthy evita que este
      # contenedor arranque contra un esquema todavía no migrado, y
      # evita que ambos corran `migrate` en paralelo.
      tickets:
        condition: service_healthy
    networks: [backend]

  inventory:
    build:
      context: .
      args:
        SERVICE_SETTINGS: config.service_settings.inventory
    environment:
      DJANGO_SETTINGS_MODULE: config.service_settings.inventory
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},inventory
      INVENTORY_DB_ENGINE: django.db.backends.postgresql
      INVENTORY_DB_HOST: db-inventory
      INVENTORY_DB_PORT: 5432
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER:-inventory}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Falta INVENTORY_DB_PASSWORD en .env}
      # BD externa GLPI (MariaDB, solo lectura) — sin defaults inseguros,
      # falla explícito si faltan en .env (mismo criterio que el monolito).
      DB_HOST: ${GLPI_DB_HOST:?Falta GLPI_DB_HOST en .env}
      DB_USER: ${GLPI_DB_USER:?Falta GLPI_DB_USER en .env}
      DB_PASSWORD: ${GLPI_DB_PASSWORD:?Falta GLPI_DB_PASSWORD en .env}
      DB_NAME: ${GLPI_DB_NAME:-glpi}
      DB_PORT: ${GLPI_DB_PORT:-3306}
      GLPI_BASE_URL: ${GLPI_BASE_URL:-https://glpi.cmm.uchile.cl}
      GLPI_BREAKER_FAIL_MAX: ${GLPI_BREAKER_FAIL_MAX:-5}
      GLPI_BREAKER_RESET_TIMEOUT: ${GLPI_BREAKER_RESET_TIMEOUT:-30}
    volumes:
      - inventory_media:/app/media
    depends_on:
      db-inventory:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  gateway:
    build:
      context: .
      args:
        SERVICE_SETTINGS: config.service_settings.gateway
    environment:
      DJANGO_SETTINGS_MODULE: config.service_settings.gateway
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},gateway
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      ACCOUNTS_SERVICE_URL: http://accounts:8000
      TICKETS_SERVICE_URL: http://tickets:8000
      INVENTORY_SERVICE_URL: http://inventory:8000
      GATEWAY_UPSTREAM_TIMEOUT: ${GATEWAY_UPSTREAM_TIMEOUT:-10}
      GATEWAY_DB_NAME: /app/data/gateway_db.sqlite3
    ports:
      - "8000:8000"
    depends_on:
      accounts:
        condition: service_healthy
      tickets:
        condition: service_healthy
      inventory:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Sesión server-side del BFF (fase 2, ver plan): SESSION_ENGINE
  # cache-backed apunta acá, así la sesión (con el JWT adentro) no vive
  # en memoria del proceso ni en su BD sqlite placeholder.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # BFF (ver plan en .claude/plans/zippy-bubbling-pumpkin.md): proxy
  # hacia el Gateway + sesión propia (fase 2: login/logout/me con
  # cookie httpOnly, JWT guardado server-side en Redis). Puerto
  # distinto (8010) al del Gateway (8000) mientras el frontend sigue
  # sin migrar — el frontend TODAVÍA no habla con este servicio.
  bff:
    build:
      context: .
      args:
        SERVICE_SETTINGS: config.service_settings.bff
    environment:
      DJANGO_SETTINGS_MODULE: config.service_settings.bff
      SECRET_KEY: ${SECRET_KEY:?Falta SECRET_KEY en .env}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1},bff
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173}
      GATEWAY_URL: http://gateway:8000
      BFF_UPSTREAM_TIMEOUT: ${BFF_UPSTREAM_TIMEOUT:-10}
      BFF_DB_NAME: /app/data/bff_db.sqlite3
      REDIS_URL: redis://redis:6379/0
      # Login con Google (ver bff/auth_views.py) + secreto interno
      # compartido con accounts (auth/google-mint/).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8010/api/v1/bff/auth/google/callback/}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET:?Falta INTERNAL_AUTH_SECRET en .env}
    ports:
      - "8010:8000"
    depends_on:
      gateway:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  backend:

volumes:
  db_accounts_data:
  db_tickets_data:
  db_inventory_data:
  inventory_media:
  redis_data:
