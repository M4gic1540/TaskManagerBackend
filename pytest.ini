[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
addopts = --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing
# gateway/ solo tiene sentido bajo config.service_settings.gateway (no
# hay app "gateway" ni rutas montadas en el monolito) — se excluye de
# la recolección automática por default; sigue corriendo explícito con
# `pytest --ds=config.service_settings.gateway gateway/`.
norecursedirs = .git .venv gateway
