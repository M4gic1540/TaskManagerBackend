[pytest]
DJANGO_SETTINGS_MODULE = config.settings
python_files = test_*.py
addopts = --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing
# gateway/ y bff/ solo tienen sentido bajo su propio
# config.service_settings.<gateway|bff> (no hay esas apps ni rutas
# montadas en el monolito) — se excluyen de la recolección automática
# por default; siguen corriendo explícito con
# `pytest --ds=config.service_settings.<gateway|bff> <gateway|bff>/`.
norecursedirs = .git .venv gateway bff
